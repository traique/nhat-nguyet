name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản phát hành, dạng X.Y.Z (phải khớp APP_VERSION trong app/build.gradle). Để trống = chỉ build thử.'
        required: false
        default: ''

# Mặc định chỉ đọc; riêng job phát hành mới được ghi (tạo tag, Release).
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.ver.outputs.release }}
      name: ${{ steps.ver.outputs.name }}
      apk: ${{ steps.pack.outputs.apk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # BUILD_TIME lấy từ ngày commit

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Kiểm thử và lint (API 15, cả hai flavor)
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:lintGithubDebug :app:lintStoreDebug

      - name: Xác định phiên bản
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          APP_VERSION=$(sed -nE "s/^def APP_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" app/build.gradle)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            V="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "::error::Đã có tag v$V – hãy chọn số phiên bản lớn hơn."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=""
          fi
          if [[ -n "$V" ]]; then
            if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Phiên bản phải có dạng X.Y.Z (vd 1.2.3), nhận được $V"
              exit 1
            fi
            if [[ "$V" != "$APP_VERSION" ]]; then
              echo "::error::Tag v$V không khớp APP_VERSION = $APP_VERSION trong app/build.gradle. Sửa gradle, commit rồi tag lại."
              exit 1
            fi
            if ! grep -qE "^## $V\b" CHANGELOG.md; then
              echo "::error::CHANGELOG.md chưa có mục '## $V'."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            V="0.0.${GITHUB_RUN_NUMBER}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Giải mã keystore
        if: steps.ver.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret KEYSTORE_BASE64 – xem README, mục Phát hành bản mới."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build bản debug (nhánh, PR)
        if: steps.ver.outputs.release != 'true'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          UPDATE_REPO: ${{ github.repository }}
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:assembleStoreDebug

      - name: 'Build bản release đã ký (github: APK có OTA; store: APK và AAB không OTA)'
        if: steps.ver.outputs.release == 'true'
        env:
          UPDATE_REPO: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleGithubRelease :app:assembleStoreRelease :app:bundleStoreRelease

      - name: Đóng gói APK, update.json và ghi chú phát hành
        id: pack
        env:
          V: ${{ steps.ver.outputs.name }}
          RELEASE: ${{ steps.ver.outputs.release }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ "$RELEASE" = "true" ]; then
            SRC=app/build/outputs/apk/github/release/app-github-release.apk
            APK="NhatNguyet-$V.apk"
            # Không bao giờ phát hành bản ký bằng khoá debug.
            if "$BT/apksigner" verify --print-certs "$SRC" | grep -q "CN=Android Debug"; then
              echo "::error::APK đang ký bằng khoá debug – kiểm tra các secret KEYSTORE_*"
              exit 1
            fi
            "$BT/apksigner" verify --min-sdk-version 15 "$SRC"
            "$BT/zipalign" -c -v 4 "$SRC" > /dev/null
            # Thư viện native phải căn trang 16 KB (Google Play, máy Android 16).
            if "$BT/zipalign" -c -P 16 -v 4 "$SRC" | grep -q "Verification FAILED"; then
              echo "::warning::Có thư viện native chưa căn 16 KB trong $SRC"
            fi
            cp app/build/outputs/apk/store/release/app-store-release.apk "out/NhatNguyet-$V-store.apk"
            cp app/build/outputs/bundle/storeRelease/app-store-release.aab "out/NhatNguyet-$V-store.aab"
            # Ghi chú phát hành: mục "## $V" trong CHANGELOG.md.
            awk -v v="$V" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > out/notes.md
          else
            SRC=app/build/outputs/apk/github/debug/app-github-debug.apk
            APK="NhatNguyet-$V-debug.apk"
            cp app/build/outputs/apk/store/debug/app-store-debug.apk "out/NhatNguyet-$V-store-debug.apk"
            git log -1 --pretty=%s > out/notes.md
          fi
          cp "$SRC" "out/$APK"
          CODE=$("$BT/aapt" dump badging "out/$APK" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)
          SHA=$(sha256sum "out/$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "out/$APK")
          python3 - "$CODE" "$V" "$REPO" "$APK" "$SHA" "$SIZE" out/notes.md > out/update.json <<'PY'
          import json, sys
          code, v, repo, apk, sha, size, notes_path = sys.argv[1:8]
          notes = open(notes_path, encoding="utf-8").read().strip()
          # Dòng trạng thái trong app chỉ hiện vài dòng: rút gọn, bỏ dấu gạch đầu dòng.
          lines = [l.lstrip("-*• ").strip() for l in notes.splitlines() if l.strip()]
          notes = "\n".join(lines)[:500]
          print(json.dumps({
              "versionCode": int(code),
              "versionName": v,
              "apk": f"https://github.com/{repo}/releases/download/v{v}/{apk}",
              "sha256": sha,
              "size": int(size),
              "minSdk": 15,
              "notes": notes,
          }, ensure_ascii=False, indent=2))
          PY
          cat out/update.json
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Lưu APK (tải trong tab Actions)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NhatNguyet-${{ steps.ver.outputs.name }}
          path: out/*

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NhatNguyet-${{ needs.build.outputs.name }}
          path: out

      - name: Tạo GitHub Release (OTA)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.build.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Nhật Nguyệt ${{ needs.build.outputs.name }}
          body_path: out/notes.md
          files: |
            out/${{ needs.build.outputs.apk }}
            out/update.json
            out/NhatNguyet-${{ needs.build.outputs.name }}-store.apk
            out/NhatNguyet-${{ needs.build.outputs.name }}-store.aab
