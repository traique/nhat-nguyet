plugins {
    id 'com.android.application'
}

// Phiên bản lấy từ biến môi trường VERSION_NAME (CI đặt theo tag vX.Y.Z).
// versionCode = X*10000 + Y*100 + Z, luôn tăng khi tăng tag.
def verName = (System.getenv('VERSION_NAME') ?: (project.findProperty('versionName') ?: '0.1.0')).toString()
def verParts = verName.tokenize('.-')
def verCode = 0
try {
    verCode = verParts[0].toInteger() * 10000 + verParts[1].toInteger() * 100 + verParts[2].toInteger()
} catch (Exception ignored) {
    verCode = 1
}
if (verCode < 1) verCode = 1

def updateRepo = (System.getenv('UPDATE_REPO') ?: 'traique/nhat-nguyet').toString()
// Có thể trỏ sang máy chủ khác để thử OTA (vd. http://10.0.2.2:8000/update.json trên máy ảo).
def updateUrl = (System.getenv('UPDATE_URL') ?: "https://github.com/${updateRepo}/releases/latest/download/update.json").toString()

android {
    namespace 'vn.nhatnguyet'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.nhatnguyet'
        minSdk 15
        targetSdk 34
        versionCode verCode
        versionName verName
        buildConfigField 'String', 'UPDATE_URL', "\"${updateUrl}\""
        ndk {
            // Conscrypt chỉ dùng trên Android < 5.0, nhưng phải có cả bản 64-bit
            // để máy mới chỉ chạy 64-bit vẫn cài được.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ks = System.getenv('KEYSTORE_FILE')
            def hasKeystore = ks != null && file(ks).exists()
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        error 'NewApi'
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'SetTextI18n', 'HardcodedText',
                'GradleDependency', 'MissingTranslation', 'IconMissingDensityFolder',
                'Overdraw', 'UnusedResources', 'MonochromeLauncherIcon', 'DiscouragedApi',
                'SpUsage', 'ClickableViewAccessibility', 'BatteryLife', 'Wakelock',
                'WakelockTimeout', 'ProtectedPermissions', 'QueryAllPackagesPermission',
                'RequestInstallPackagesPolicy', 'ExportedReceiver', 'UnspecifiedRegisterReceiverFlag',
                'CustomX509TrustManager', 'TrustAllX509TrustManager', 'ScheduleExactAlarm',
                'ExactAlarm', 'ObsoleteSdkInt', 'SystemPermissionTypo', 'UseCompatLoadingForDrawables',
                'DrawAllocation', 'ViewConstructor', 'LockedOrientationActivity', 'SourceLockedOrientationActivity',
                'MissingApplicationIcon', 'AppLinkUrlError', 'DefaultLocale'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Bản cuối cùng của Conscrypt còn hỗ trợ Android cũ (minSdk 9). Từ 2.6.0 đòi API 21.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
